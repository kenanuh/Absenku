<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Absenku</title>
<link rel="stylesheet" href="style.css">

<style>
.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    background:
        radial-gradient(circle at 10% 10%, rgba(0,123,255,0.14), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(0,86,179,0.12), transparent 30%),
        #f4f7fb;
}

.login-wrapper {
    width: 100%;
    max-width: 950px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.12);
}

.login-info {
    position: relative;
    overflow: hidden;
    padding: 55px 45px;
    color: white;
    background: linear-gradient(145deg, #007bff, #0056b3);
}

.login-info::before {
    content: "";
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    top: -120px;
    right: -100px;
}

.login-info::after {
    content: "";
    position: absolute;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    bottom: -90px;
    left: -70px;
}

.logo-box {
    width: 65px;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 18px;
    font-size: 30px;
    margin-bottom: 30px;
    position: relative;
    z-index: 2;
}

.login-info h1 {
    margin: 0 0 15px;
    font-size: 42px;
    line-height: 1.1;
    position: relative;
    z-index: 2;
}

.login-info p {
    margin: 0;
    max-width: 350px;
    color: rgba(255,255,255,0.86);
    line-height: 1.7;
    font-size: 15px;
    position: relative;
    z-index: 2;
}

.login-feature {
    margin-top: 40px;
    position: relative;
    z-index: 2;
}

.feature-item {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    font-size: 14px;
}

.feature-icon {
    width: 27px;
    height: 27px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.18);
    border-radius: 50%;
}

.login-form {
    padding: 55px 50px;
}

.login-header {
    margin-bottom: 32px;
}

.login-header h2 {
    margin: 0 0 8px;
    color: #151515;
    font-size: 29px;
}

.login-header p {
    margin: 0;
    color: #888;
    font-size: 14px;
}

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;
    margin-bottom: 9px;
    font-size: 14px;
    font-weight: bold;
    color: #222;
}

.input-box {
    position: relative;
}

.input-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 17px;
    color: #8b96a3;
}

.input-box input {
    width: 100%;
    height: 52px;
    padding: 0 15px 0 45px;
    border: 1px solid #dce1e7;
    border-radius: 11px;
    background: #f9fafc;
    font-size: 15px;
    color: #222;
    transition: 0.2s;
}

.input-box input:focus {
    outline: none;
    background: white;
    border-color: #007bff;
    box-shadow: 0 0 0 4px rgba(0,123,255,0.10);
}

.input-box input::placeholder {
    color: #a5adb7;
}

.login-button {
    width: 100%;
    height: 52px;
    margin-top: 8px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, #007bff, #0062d6);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(0,123,255,0.25);
    transition: 0.2s;
}

.login-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0,123,255,0.32);
}

.demo-box {
    margin-top: 22px;
    padding: 13px 15px;
    border-radius: 10px;
    background: #f1f6ff;
    border: 1px solid #dceaff;
    color: #555;
    font-size: 13px;
    text-align: center;
}

.demo-box strong {
    color: #007bff;
}

@media (max-width: 750px) {
    .login-wrapper {
        grid-template-columns: 1fr;
        max-width: 500px;
    }

    .login-info {
        padding: 35px 30px;
    }

    .login-info h1 {
        font-size: 34px;
    }

    .login-feature {
        margin-top: 25px;
    }

    .login-form {
        padding: 35px 30px;
    }
}

@media (max-width: 450px) {
    .login-page {
        padding: 15px;
    }

    .login-info {
        padding: 30px 25px;
    }

    .login-form {
        padding: 30px 22px;
    }
}
</style>
</head>

<body>

<main class="login-page">

    <div class="login-wrapper">

        <section class="login-info">

            <div class="logo-box">
                📋
            </div>

            <h1>Absenku</h1>

            <p>
                Sistem absensi siswa yang sederhana,
                rapi, dan mudah digunakan untuk
                mengelola kehadiran siswa.
            </p>

            <div class="login-feature">

                <div class="feature-item">
                    <span class="feature-icon">✓</span>
                    Kelola data siswa
                </div>

                <div class="feature-item">
                    <span class="feature-icon">✓</span>
                    Catat absensi dengan mudah
                </div>

                <div class="feature-item">
                    <span class="feature-icon">✓</span>
                    Pantau riwayat kehadiran
                </div>

            </div>

        </section>

        <section class="login-form">

            <div class="login-header">
                <h2>Selamat Datang 👋</h2>
                <p>Silakan login untuk melanjutkan ke Absenku.</p>
            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-box">

                        <span class="input-icon">👤</span>

                        <input
                            type="text"
                            id="username"
                            placeholder="Masukkan username"
                            autocomplete="username"
                            required>

                    </div>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required>

                    </div>

                </div>

                <button
                    type="submit"
                    class="login-button">
                    Login
                </button>

            </form>

            <div class="demo-box">
                Demo: <strong>admin</strong> /
                <strong>admin123</strong>
            </div>

        </section>

    </div>

</main>

<script>
document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        if (
            username === "admin" &&
            password === "admin123"
        ) {

            localStorage.setItem(
                "username",
                username
            );

            location.href = "index.html";

        } else {

            alert("Username atau password salah.");

        }

    });
</script>

</body>
</html>
