<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Absenku</title>
<link rel="stylesheet" href="style.css">

<style>
.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    background:
        radial-gradient(circle at top left, rgba(0,123,255,0.12), transparent 35%),
        #f4f7fb;
}

.login-card {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 42px;
    border-radius: 20px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.10);
}

.login-logo {
    width: 65px;
    height: 65px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: linear-gradient(135deg, #007bff, #0056b3);
    color: white;
    font-size: 30px;
    box-shadow: 0 8px 20px rgba(0,123,255,0.25);
}

.login-header {
    text-align: center;
    margin-bottom: 32px;
}

.login-header h1 {
    margin: 0 0 8px;
    font-size: 32px;
    color: #151515;
}

.login-header p {
    margin: 0;
    color: #888;
    font-size: 14px;
}

.login-group {
    margin-bottom: 21px;
}

.login-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
    color: #222;
}

.login-input {
    position: relative;
}

.login-input span {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 17px;
    color: #8993a0;
}

.login-input input {
    width: 100%;
    height: 52px;
    padding: 0 15px 0 45px;
    border: 1px solid #dce1e7;
    border-radius: 10px;
    background: #f9fafc;
    font-size: 15px;
    color: #222;
    transition: 0.2s;
}

.login-input input::placeholder {
    color: #a4acb7;
}

.login-input input:focus {
    outline: none;
    background: white;
    border-color: #007bff;
    box-shadow: 0 0 0 4px rgba(0,123,255,0.10);
}

.login-button {
    width: 100%;
    height: 52px;
    margin-top: 8px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #007bff, #0062d6);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(0,123,255,0.23);
    transition: 0.2s;
}

.login-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(0,123,255,0.30);
}

.demo-box {
    margin-top: 20px;
    padding: 12px;
    text-align: center;
    background: #f1f6ff;
    border: 1px solid #dceaff;
    border-radius: 9px;
    color: #777;
    font-size: 13px;
}

.demo-box strong {
    color: #007bff;
}

@media (max-width: 500px) {
    .login-page {
        padding: 15px;
    }

    .login-card {
        padding: 32px 24px;
    }
}
</style>
</head>

<body>

<main class="login-page">

    <div class="login-card">

        <div class="login-logo">
            📋
        </div>

        <div class="login-header">
            <h1>Absenku</h1>
            <p>Silakan login untuk melanjutkan</p>
        </div>

        <form id="loginForm">

            <div class="login-group">

                <label for="username">
                    Username
                </label>

                <div class="login-input">

                    <span>👤</span>

                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required>

                </div>

            </div>

            <div class="login-group">

                <label for="password">
                    Password
                </label>

                <div class="login-input">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required>

                </div>

            </div>

            <button
                type="submit"
                class="login-button">
                Login
            </button>

        </form>

        <div class="demo-box">
            Demo: <strong>admin</strong> /
            <strong>admin123</strong>
        </div>

    </div>

</main>

<script>
document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        if (
            username === "admin" &&
            password === "admin123"
        ) {

            localStorage.setItem(
                "username",
                username
            );

            location.href = "index.html";

        } else {

            alert("Username atau password salah.");

        }

    });
</script>

</body>
</html>
