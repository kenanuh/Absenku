<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Absensi Siswa</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<div class="login-box">
  <h1>Absensi Siswa</h1>
  <p>Silakan login untuk melanjutkan</p>
  <div id="error" class="error hidden"></div>
  <form id="loginForm">
    <div class="form-group"><label>Username</label><input id="username" required placeholder="Masukkan username"></div>
    <div class="form-group"><label>Password</label><input id="password" type="password" required placeholder="Masukkan password"></div>
    <button type="submit">Login</button>
  </form>
  <small class="login-info">Demo: admin / admin123</small>
</div>
<script src="script.js"></script>
<script>
if (localStorage.getItem("username")) location.href = "index.html";
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value;
  if (u === "admin" && p === "admin123") {
    localStorage.setItem("username", u);
    location.href = "index.html";
  } else {
    const el = document.getElementById("error");
    el.textContent = "Username atau password salah.";
    el.classList.remove("hidden");
  }
});
</script>
</body>
</html>
