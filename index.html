<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Absenku</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<script src="script.js"></script>
<script>
requireLogin();
</script>

<nav class="navbar"></nav>

<main class="container">

    <section class="header">
        <h1>Dashboard</h1>
        <p>Selamat datang di Absenku.</p>
    </section>

    <section class="cards">

        <div class="card">
            <h3>Total Siswa</h3>
            <div class="card-number" id="totalSiswa">0</div>
        </div>

        <div class="card">
            <h3>Hadir Bulan Ini</h3>
            <div class="card-number" id="hadirBulanIni">0</div>
        </div>

        <div class="card">
            <h3>Tidak Hadir Bulan Ini</h3>
            <div class="card-number" id="tidakHadirBulanIni">0</div>
        </div>

    </section>

</main>

<script>
renderNavbar();
updateDashboard();
</script>

</body>
</html>
