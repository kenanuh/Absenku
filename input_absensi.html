<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Absensi - Absenku</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #111;
        }

        .navbar {
            background: #007bff;
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .navbar-brand {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            padding: 17px 0;
            margin-right: 30px;
        }

        .navbar-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            flex: 1;
        }

        .navbar-menu li a {
            display: block;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            padding: 20px 18px;
            font-size: 14px;
            font-weight: bold;
        }

        .navbar-menu li a:hover,
        .navbar-menu li a.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
            font-size: 14px;
        }

        .btn-logout {
            background: #dc3545;
            color: white !important;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 8px;
            font-size: 38px;
        }

        .header p {
            color: #777;
            font-size: 18px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: bold;
            font-size: 16px;
        }

        select,
        input[type="date"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }

        select:focus,
        input:focus,
        textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
            font-family: Arial, sans-serif;
        }

        .optional-section {
            display: none;
            margin-top: 10px;
        }

        .optional-section.show {
            display: block;
        }

        .file-info {
            display: block;
            margin-top: 7px;
            color: #777;
            font-size: 13px;
        }

        .preview {
            display: none;
            margin-top: 15px;
        }

        .preview.show {
            display: block;
        }

        .preview img {
            max-width: 300px;
            max-height: 250px;
            border-radius: 8px;
            border: 1px solid #ddd;
            object-fit: contain;
        }

        .btn-submit {
            background: #007bff;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-submit:hover {
            background: #0056b3;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f5f6f8;
        }

        tr[data-link] {
            cursor: pointer;
        }

        tr[data-link]:hover {
            background: #f7f9fc;
        }

        .empty {
            color: #777;
            text-align: center;
        }

        @media (max-width: 800px) {
            .navbar {
                flex-direction: column;
                padding: 10px;
            }

            .navbar-brand {
                margin-right: 0;
            }

            .navbar-menu {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .navbar-menu li a {
                padding: 12px;
            }

            .navbar-user {
                margin: 10px 0;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .container {
                width: 94%;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <a href="index.html" class="navbar-brand">Absenku</a>

    <ul class="navbar-menu">
        <li>
            <a href="index.html">Dashboard</a>
        </li>

        <li>
            <a href="input_absensi.html" class="active">Input Absensi</a>
        </li>

        <li>
            <a href="tampil_siswa.html">Data Siswa</a>
        </li>
    </ul>

    <div class="navbar-user">
        <span>
            Halo,
            <strong id="namaAdmin">Admin</strong>
        </span>

        <a
            href="logout.html"
            class="btn-logout"
            onclick="return confirm('Apakah Anda yakin ingin keluar?')">
            Logout
        </a>
    </div>
</nav>

<div class="container">

    <div class="header">
        <h1>Input Absensi</h1>
        <p>Catat kehadiran siswa.</p>
    </div>

    <div class="card">

        <h2>Input Absensi Siswa</h2>

        <form id="absensiForm">

            <div class="form-row">

                <div class="form-group">
                    <label for="kelas">Kelas</label>

                    <select id="kelas" required>
                        <option value="">Pilih kelas</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="siswa">Siswa</label>

                    <select id="siswa" required disabled>
                        <option value="">Pilih kelas terlebih dahulu</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tanggal">Tanggal</label>

                    <input
                        type="date"
                        id="tanggal"
                        required>
                </div>

            </div>

            <div class="form-group">

                <label for="status">Status</label>

                <select id="status" required>
                    <option value="Hadir">Hadir</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                    <option value="Alpa">Alpa</option>
                </select>

            </div>

            <div id="alasanSection" class="optional-section">

                <div class="form-group">

                    <label for="alasan">Alasan</label>

                    <textarea
                        id="alasan"
                        placeholder="Masukkan alasan izin atau sakit..."></textarea>

                </div>

            </div>

            <div id="suratSection" class="optional-section">

                <div class="form-group">

                    <label for="surat">
                        Foto Surat Izin / Sakit
                    </label>

                    <input
                        type="file"
                        id="surat"
                        accept="image/*">

                    <small class="file-info">
                        Upload foto surat izin atau surat sakit. Maksimal ukuran 2 MB.
                    </small>

                    <div id="preview" class="preview">

                        <p>Preview foto:</p>

                        <img
                            id="previewImage"
                            src=""
                            alt="Preview surat">

                    </div>

                </div>

            </div>

            <button type="submit" class="btn-submit">
                Simpan Absensi
            </button>

        </form>

    </div>

    <div class="card">

        <h2>Riwayat Absensi</h2>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Siswa</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="absensiTable">

                    <tr>
                        <td colspan="3" class="empty">
                            Belum ada absensi.
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="script.js"></script>

<script>

requireLogin();

const username =
    localStorage.getItem("username") || "Admin";

document.getElementById("namaAdmin").textContent = username;

const kelasElement =
    document.getElementById("kelas");

const siswaElement =
    document.getElementById("siswa");

const tanggalElement =
    document.getElementById("tanggal");

const statusElement =
    document.getElementById("status");

const alasanElement =
    document.getElementById("alasan");

const alasanSection =
    document.getElementById("alasanSection");

const suratSection =
    document.getElementById("suratSection");

const suratElement =
    document.getElementById("surat");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

tanggalElement.value = today();

function getSiswa() {
    return JSON.parse(
        localStorage.getItem("siswa") || "[]"
    );
}

function loadKelas() {

    const siswa = getSiswa();

    const kelasList = [
        ...new Set(
            siswa
                .map(function(item) {
                    return item.kelas;
                })
                .filter(function(kelas) {
                    return kelas;
                })
        )
    ].sort();

    kelasElement.innerHTML =
        '<option value="">Pilih kelas</option>';

    kelasList.forEach(function(kelas) {

        const option =
            document.createElement("option");

        option.value = kelas;
        option.textContent = kelas;

        kelasElement.appendChild(option);

    });
}

function loadSiswaByKelas() {

    const kelas =
        kelasElement.value;

    const siswa =
        getSiswa();

    siswaElement.innerHTML = "";

    if (!kelas) {

        siswaElement.disabled = true;

        const option =
            document.createElement("option");

        option.value = "";
        option.textContent =
            "Pilih kelas terlebih dahulu";

        siswaElement.appendChild(option);

        return;
    }

    const siswaKelas =
        siswa.filter(function(item) {
            return item.kelas === kelas;
        });

    if (siswaKelas.length === 0) {

        siswaElement.disabled = true;

        const option =
            document.createElement("option");

        option.value = "";
        option.textContent =
            "Belum ada siswa di kelas ini";

        siswaElement.appendChild(option);

        return;
    }

    siswaElement.disabled = false;

    const defaultOption =
        document.createElement("option");

    defaultOption.value = "";
    defaultOption.textContent =
        "Pilih siswa";

    siswaElement.appendChild(defaultOption);

    siswaKelas.forEach(function(item) {

        const option =
            document.createElement("option");

        option.value = item.id;

        option.textContent =
            item.nis + " - " + item.nama;

        siswaElement.appendChild(option);

    });
}

function updateStatus() {

    const perluSurat =
        statusElement.value === "Izin" ||
        statusElement.value === "Sakit";

    if (perluSurat) {

        alasanSection.classList.add("show");
        suratSection.classList.add("show");

        alasanElement.required = true;

    } else {

        alasanSection.classList.remove("show");
        suratSection.classList.remove("show");

        alasanElement.required = false;
        alasanElement.value = "";

        suratElement.value = "";

        preview.classList.remove("show");
        previewImage.src = "";
    }
}

suratElement.addEventListener(
    "change",
    function() {

        const file =
            suratElement.files[0];

        if (!file) {
            preview.classList.remove("show");
            previewImage.src = "";
            return;
        }

        if (!file.type.startsWith("image/")) {

            alert("File harus berupa foto/gambar.");

            suratElement.value = "";

            preview.classList.remove("show");

            return;
        }

        if (file.size > 2 * 1024 * 1024) {

            alert("Ukuran foto maksimal 2 MB.");

            suratElement.value = "";

            preview.classList.remove("show");

            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(event) {

                previewImage.src =
                    event.target.result;

                preview.classList.add("show");
            };

        reader.readAsDataURL(file);
    }
);

kelasElement.addEventListener(
    "change",
    loadSiswaByKelas
);

statusElement.addEventListener(
    "change",
    updateStatus
);

function fileToBase64(file) {

    return new Promise(
        function(resolve, reject) {

            const reader =
                new FileReader();

            reader.onload =
                function() {
                    resolve(reader.result);
                };

            reader.onerror =
                function() {
                    reject(
                        new Error(
                            "Gagal membaca foto surat."
                        )
                    );
                };

            reader.readAsDataURL(file);
        }
    );
}

document
    .getElementById("absensiForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const kelas =
                kelasElement.value;

            const siswaId =
                siswaElement.value;

            const tanggal =
                tanggalElement.value;

            const status =
                statusElement.value;

            const alasan =
                alasanElement.value.trim();

            const file =
                suratElement.files[0];

            if (!kelas) {
                alert("Silakan pilih kelas.");
                return;
            }

            if (!siswaId) {
                alert("Silakan pilih siswa.");
                return;
            }

            if (!tanggal) {
                alert("Silakan pilih tanggal.");
                return;
            }

            if (
                (
                    status === "Izin" ||
                    status === "Sakit"
                ) &&
                !alasan
            ) {
                alert("Silakan isi alasan.");
                return;
            }

            let fotoSurat = "";

            if (
                (
                    status === "Izin" ||
                    status === "Sakit"
                ) &&
                file
            ) {

                if (!file.type.startsWith("image/")) {

                    alert(
                        "File surat harus berupa gambar."
                    );

                    return;
                }

                if (
                    file.size >
                    2 * 1024 * 1024
                ) {

                    alert(
                        "Ukuran foto maksimal 2 MB."
                    );

                    return;
                }

                try {

                    fotoSurat =
                        await fileToBase64(file);

                } catch (error) {

                    alert(
                        "Gagal membaca foto surat."
                    );

                    return;
                }
            }

            const absensi =
                JSON.parse(
                    localStorage.getItem("absensi") || "[]"
                );

            const dataAbsensi = {

                id:
                    Date.now().toString(),

                siswaId:
                    siswaId,

                kelas:
                    kelas,

                tanggal:
                    tanggal,

                status:
                    status,

                alasan:
                    (
                        status === "Izin" ||
                        status === "Sakit"
                    )
                        ? alasan
                        : "",

                fotoSurat:
                    (
                        status === "Izin" ||
                        status === "Sakit"
                    )
                        ? fotoSurat
                        : ""
            };

            absensi.push(dataAbsensi);

            try {

                localStorage.setItem(
                    "absensi",
                    JSON.stringify(absensi)
                );

            } catch (error) {

                alert(
                    "Foto terlalu besar untuk disimpan. Gunakan foto yang lebih kecil."
                );

                return;
            }

            alert("Absensi berhasil disimpan.");

            document
                .getElementById("absensiForm")
                .reset();

            tanggalElement.value = today();

            siswaElement.innerHTML =
                '<option value="">Pilih kelas terlebih dahulu</option>';

            siswaElement.disabled = true;

            preview.classList.remove("show");

            previewImage.src = "";

            updateStatus();

            loadKelas();

            renderRiwayat();
        }
    );

function renderRiwayat() {

    const table =
        document.getElementById("absensiTable");

    const siswa =
        getSiswa();

    const absensi =
        JSON.parse(
            localStorage.getItem("absensi") || "[]"
        );

    if (absensi.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="3" class="empty">
                    Belum ada absensi.
                </td>
            </tr>
        `;

        return;
    }

    table.innerHTML =
        [...absensi]
            .reverse()
            .map(function(item) {

                const siswaData =
                    siswa.find(function(s) {
                        return s.id === item.siswaId;
                    });

                const nama =
                    siswaData
                        ? siswaData.nama
                        : "Siswa dihapus";

                const link =
                    siswaData
                        ? "detail_absensi.html?siswaId=" +
                          encodeURIComponent(item.siswaId) +
                          "&tanggal=" +
                          encodeURIComponent(item.tanggal)
                        : "#";

                return `
                    <tr
                        data-link="${link}"
                        onclick="
                            if('${link}' !== '#') {
                                window.location.href='${link}';
                            }
                        "
                    >
                        <td>
                            ${escapeHtml(item.tanggal)}
                        </td>

                        <td>
                            ${escapeHtml(nama)}
                        </td>

                        <td>
                            ${escapeHtml(item.status)}
                        </td>
                    </tr>
                `;

            })
            .join("");
}

loadKelas();
loadSiswaByKelas();
updateStatus();
renderRiwayat();

</script>

</body>
</html>
