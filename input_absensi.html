<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Input Absensi - Absensi Siswa</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .reason-group {
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .reason-group.hidden {
            display: none;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        .reason-info {
            display: block;
            margin-top: 6px;
            color: #777;
            font-size: 13px;
        }

    </style>

</head>


<body>


<script src="script.js"></script>

<script>
    requireLogin();
</script>


<nav class="navbar"></nav>


<main class="container">


    <section class="header">

        <h1>
            Input Absensi
        </h1>

        <p>
            Catat kehadiran siswa.
        </p>

    </section>


    <div class="panel">

        <form id="absensiForm">


            <div class="form-grid">


                <div>

                    <label for="kelas">
                        Kelas
                    </label>

                    <select
                        id="kelas"
                        required
                    >

                        <option value="">
                            Pilih Kelas
                        </option>

                    </select>

                </div>


                <div>

                    <label for="siswa">
                        Siswa
                    </label>

                    <select
                        id="siswa"
                        required
                        disabled
                    >

                        <option value="">
                            Pilih kelas terlebih dahulu
                        </option>

                    </select>

                </div>


                <div>

                    <label for="tanggal">
                        Tanggal
                    </label>

                    <input
                        type="date"
                        id="tanggal"
                        required
                    >

                </div>


                <div>

                    <label for="status">
                        Status
                    </label>

                    <select
                        id="status"
                        required
                    >

                        <option value="Hadir">
                            Hadir
                        </option>

                        <option value="Izin">
                            Izin
                        </option>

                        <option value="Sakit">
                            Sakit
                        </option>

                        <option value="Alpa">
                            Alpa
                        </option>

                    </select>

                </div>


            </div>


            <div
                id="alasanGroup"
                class="reason-group hidden"
            >

                <label for="alasan">
                    Alasan
                </label>

                <textarea
                    id="alasan"
                    placeholder="Tuliskan alasan izin atau sakit..."
                ></textarea>

                <small class="reason-info">
                    Alasan wajib diisi jika status Izin atau Sakit.
                </small>

            </div>



            <button type="submit">
                Simpan Absensi
            </button>


        </form>

    </div>



    <!-- RIWAYAT -->

    <div class="panel">

        <h2>
            Riwayat Absensi
        </h2>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            Tanggal
                        </th>

                        <th>
                            Siswa
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody id="absensiTable">

                </tbody>

            </table>

        </div>

    </div>


</main>



<script>


    renderNavbar();


    const kelasElement =
        document.getElementById("kelas");

    const siswaElement =
        document.getElementById("siswa");

    const statusElement =
        document.getElementById("status");

    const alasanElement =
        document.getElementById("alasan");

    const alasanGroup =
        document.getElementById("alasanGroup");


    document.getElementById("tanggal").value =
        today();


    function loadKelas() {

        const siswa =
            JSON.parse(
                localStorage.getItem("siswa") || "[]"
            );


        const kelasList =
            [...new Set(
                siswa.map(function(item) {
                    return item.kelas;
                })
            )]
            .filter(function(kelas) {
                return kelas;
            })
            .sort();


        kelasElement.innerHTML = `
            <option value="">
                Pilih Kelas
            </option>
        `;


        kelasList.forEach(function(kelas) {

            const option =
                document.createElement("option");

            option.value = kelas;

            option.textContent = kelas;

            kelasElement.appendChild(option);

        });

    }


    function loadSiswaByKelas() {

        const kelas =
            kelasElement.value;


        siswaElement.innerHTML = "";


        if (!kelas) {

            siswaElement.disabled = true;

            const option =
                document.createElement("option");

            option.value = "";

            option.textContent =
                "Pilih kelas terlebih dahulu";

            siswaElement.appendChild(option);

            return;

        }


        const siswa =
            JSON.parse(
                localStorage.getItem("siswa") || "[]"
            );


        const siswaKelas =
            siswa.filter(function(item) {

                return item.kelas === kelas;

            });


        siswaElement.disabled = false;


        const defaultOption =
            document.createElement("option");

        defaultOption.value = "";

        defaultOption.textContent =
            "Pilih Siswa";

        siswaElement.appendChild(
            defaultOption
        );


        siswaKelas.forEach(function(item) {

            const option =
                document.createElement("option");

            option.value = item.id;

            option.textContent =
                item.nis + " - " + item.nama;

            siswaElement.appendChild(option);

        });


        if (siswaKelas.length === 0) {

            siswaElement.disabled = true;

            siswaElement.innerHTML = `
                <option value="">
                    Tidak ada siswa di kelas ini
                </option>
            `;

        }

    }


    kelasElement.addEventListener(
        "change",
        function() {

            loadSiswaByKelas();

        }
    );


    function updateAlasanField() {

        const status =
            statusElement.value;


        const perluAlasan =
            status === "Izin" ||
            status === "Sakit";


        if (perluAlasan) {

            alasanGroup.classList.remove(
                "hidden"
            );

            alasanElement.required = true;

        } else {

            alasanGroup.classList.add(
                "hidden"
            );

            alasanElement.required = false;

            alasanElement.value = "";

        }

    }


    statusElement.addEventListener(
        "change",
        updateAlasanField
    );


    updateAlasanField();


    document
        .getElementById("absensiForm")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const kelas =
                    kelasElement.value;

                const siswaId =
                    siswaElement.value;

                const tanggal =
                    document.getElementById(
                        "tanggal"
                    ).value;

                const status =
                    statusElement.value;

                const alasan =
                    alasanElement.value.trim();


                if (!kelas) {

                    alert(
                        "Silakan pilih kelas terlebih dahulu."
                    );

                    return;

                }


                if (!siswaId) {

                    alert(
                        "Silakan pilih siswa."
                    );

                    return;

                }


                if (
                    (
                        status === "Izin" ||
                        status === "Sakit"
                    ) &&
                    !alasan
                ) {

                    alert(
                        "Alasan wajib diisi untuk status Izin atau Sakit."
                    );

                    alasanElement.focus();

                    return;

                }


                const absensi =
                    JSON.parse(
                        localStorage.getItem(
                            "absensi"
                        ) || "[]"
                    );


                const index =
                    absensi.findIndex(
                        function(item) {

                            return (
                                item.siswaId === siswaId &&
                                item.tanggal === tanggal
                            );

                        }
                    );


                const dataAbsensi = {

                    siswaId: siswaId,

                    tanggal: tanggal,

                    status: status,

                    alasan:
                        (
                            status === "Izin" ||
                            status === "Sakit"
                        )
                        ? alasan
                        : ""

                };


                if (index >= 0) {

                    absensi[index] =
                        dataAbsensi;

                } else {

                    absensi.push(
                        dataAbsensi
                    );

                }


                localStorage.setItem(
                    "absensi",
                    JSON.stringify(absensi)
                );



                alert(
                    "Absensi berhasil disimpan."
                );


                this.reset();


                siswaElement.innerHTML = `
                    <option value="">
                        Pilih kelas terlebih dahulu
                    </option>
                `;

                siswaElement.disabled = true;


                alasanGroup.classList.add(
                    "hidden"
                );

                alasanElement.required = false;


                document.getElementById(
                    "tanggal"
                ).value = today();


                loadKelas();


                renderAbsensi();

            }
        );



    loadKelas();

    renderAbsensi();


</script>


</body>

</html>
